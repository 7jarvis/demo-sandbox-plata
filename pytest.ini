[pytest]
testpaths = tests
pythonpath = tests
addopts = -ra --strict-markers --strict-config
markers =
    smoke: critical business path; runs on every push and blocks the regression run
    regression: the full suite (added to every test automatically; smoke is a subset)
    api: JSON API tests (added automatically for tests/api)
    ui: browser tests (added automatically for tests/ui)
    slow: concurrency and other tests that take more than a second
xfail_strict = true
